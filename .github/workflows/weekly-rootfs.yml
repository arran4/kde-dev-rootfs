name: Build KDE development rootfs

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to increment when dispatching from main
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  schedule:
    # Monday 04:17 UTC. Avoid the top of the hour, when scheduled Actions
    # commonly experience the most queueing.
    - cron: "17 4 * * 1"

permissions:
  contents: write
  packages: write

concurrency:
  # Main/scheduled releases are serialized. Each PR gets its own group, and a
  # newer push to the same PR supersedes an older in-progress validation build.
  group: kde-dev-rootfs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUITE: forky
  ARCH: amd64

jobs:
  build:
    name: Build rootfs
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # git-tag-inc must be able to inspect the complete tag history.
          fetch-depth: 0

      - name: Prepare scripts
        run: chmod +x scripts/*.sh scripts/*.py

      - name: Determine build mode
        id: mode
        env:
          DISPATCH_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          release=false
          bump=patch

          # Only a build whose checked-out ref is main may publish. This covers
          # pushes/merges to main and scheduled runs. workflow_dispatch follows
          # the same rule, so dispatching another branch is build-only.
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
              release=true

              if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                  bump="${DISPATCH_BUMP:-patch}"
              fi
          fi

          case "$bump" in
              patch|minor|major)
                  ;;
              *)
                  echo "Unsupported version bump: $bump" >&2
                  exit 1
                  ;;
          esac

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Publish release: $release"
          echo "Version bump: $bump"

      - name: Configure Git identity for release tag
        if: steps.mode.outputs.release == 'true'
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set release version
        id: tagger
        if: steps.mode.outputs.release == 'true'
        uses: arran4/git-tag-inc-action@v1
        with:
          action: ${{ steps.mode.outputs.bump }}
          github-token: ${{ github.token }}

      - name: Determine build metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.mode.outputs.release }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE" == "true" ]]; then
              # git-tag-inc-action creates the prospective semantic tag locally.
              # Resolve it directly from HEAD so publication never depends on
              # action-output plumbing.
              build_tag="$(git describe --tags --exact-match HEAD)"

              if [[ -z "$build_tag" ]]; then
                  echo "git-tag-inc-action did not create a tag at HEAD" >&2
                  exit 1
              fi
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              build_tag="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA:0:12}"
          else
              build_tag="build-${GITHUB_SHA:0:12}"
          fi

          previous_tag="$(
              gh release view \
                  --json tagName \
                  --jq '.tagName' \
                  2>/dev/null || true
          )"

          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          oci_repo="ghcr.io/${GITHUB_REPOSITORY,,}"

          echo "tag=$build_tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "built_at=$built_at" >> "$GITHUB_OUTPUT"
          echo "oci_repo=$oci_repo" >> "$GITHUB_OUTPUT"

          echo "Build tag: $build_tag"
          echo "Previous release: ${previous_tag:-none}"
          echo "OCI repository: $oci_repo"

      - name: Build latest Debian testing rootfs
        env:
          SNAPSHOT_TAG: ${{ steps.metadata.outputs.tag }}
          SOURCE_REVISION: ${{ github.sha }}
        run: ./scripts/build-rootfs.sh

      - name: Download previous package manifest
        if: steps.metadata.outputs.previous_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.metadata.outputs.previous_tag }}
        run: |
          set -euo pipefail
          mkdir -p .work/previous

          gh release download "$PREVIOUS_TAG" \
              --pattern 'package-manifest.txt' \
              --dir .work/previous \
              || true

      - name: Summarise package changes
        run: |
          python3 scripts/package-diff.py \
              .work/previous/package-manifest.txt \
              dist/package-manifest.txt \
              | tee dist/package-changes.md

      - name: Write build summary
        env:
          RELEASE: ${{ steps.mode.outputs.release }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          {
              printf '# KDE development rootfs build\n\n'
              printf -- '- Build identifier: `%s`\n' "$TAG"
              printf -- '- Ref: `%s`\n' "$GITHUB_REF"
              printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
              printf -- '- Publication enabled: `%s`\n\n' "$RELEASE"
              cat dist/versions.md
              printf '\n## Changes from previous release\n\n'
              cat dist/package-changes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release notes
        if: steps.mode.outputs.release == 'true'
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.metadata.outputs.previous_tag }}
          BUILT_AT: ${{ steps.metadata.outputs.built_at }}
          OCI_REPO: ${{ steps.metadata.outputs.oci_repo }}
        run: |
          set -euo pipefail

          asset="kde-dev-rootfs-${SUITE}-${ARCH}.tar.zst"
          sha256="$(awk '{print $1}' "dist/${asset}.sha256")"
          size_bytes="$(stat --format='%s' "dist/${asset}")"

          {
              printf '# KDE development rootfs `%s`\n\n' "$TAG"
              printf 'Debian testing KDE/Qt development rootfs release.\n\n'

              printf '## Build\n\n'
              printf -- '- Debian suite: `%s`\n' "$SUITE"
              printf -- '- Architecture: `%s`\n' "$ARCH"
              printf -- '- Built: `%s`\n' "$BUILT_AT"
              printf -- '- Source commit: `%s`\n' "$GITHUB_SHA"
              printf -- '- Archive size: `%s` bytes\n' "$size_bytes"
              printf -- '- SHA-256: `%s`\n' "$sha256"

              if [[ -n "$PREVIOUS_TAG" ]]; then
                  printf -- '- Previous release: `%s`\n' "$PREVIOUS_TAG"
              fi

              printf '\n'
              cat dist/versions.md

              printf '\n## Changes from previous release\n\n'
              cat dist/package-changes.md

              printf '\n## Distribution\n\n'
              printf 'GitHub Release asset:\n\n'
              printf '```text\n%s\n```\n\n' "$asset"

              printf 'OCI artifact:\n\n'
              printf '```text\n%s:%s\n' "$OCI_REPO" "$TAG"
              printf '%s:%s-latest\n' "$OCI_REPO" "$SUITE"
              printf '%s:latest\n```\n\n' "$OCI_REPO"

              printf 'The complete installed package set is attached as '
              printf '`package-manifest.txt`.\n'
          } | tee dist/release-notes.md

      - name: Install ORAS
        if: steps.mode.outputs.release == 'true'
        uses: oras-project/setup-oras@v1

      - name: Login to GitHub Container Registry
        if: steps.mode.outputs.release == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" \
              | oras login ghcr.io \
                  --username "$GITHUB_ACTOR" \
                  --password-stdin

      - name: Publish immutable OCI artifact
        if: steps.mode.outputs.release == 'true'
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          BUILT_AT: ${{ steps.metadata.outputs.built_at }}
          OCI_REPO: ${{ steps.metadata.outputs.oci_repo }}
        run: |
          set -euo pipefail
          asset="kde-dev-rootfs-${SUITE}-${ARCH}.tar.zst"

          oras push \
              "${OCI_REPO}:${TAG}" \
              --artifact-type 'application/vnd.arran4.kde-dev-rootfs.v1' \
              --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --annotation "org.opencontainers.image.version=${TAG}" \
              --annotation "org.opencontainers.image.created=${BUILT_AT}" \
              --annotation "org.opencontainers.image.description=Debian ${SUITE} KDE and Qt development rootfs" \
              "dist/${asset}:application/vnd.arran4.kde-dev-rootfs.rootfs.v1.tar+zstd" \
              "dist/${asset}.sha256:text/plain" \
              'dist/package-manifest.txt:text/tab-separated-values' \
              'dist/versions.md:text/markdown'

      - name: Create GitHub Release
        if: steps.mode.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          asset="kde-dev-rootfs-${SUITE}-${ARCH}.tar.zst"

          # git-tag-inc-action created this tag locally. GitHub creates the
          # corresponding remote tag at this exact commit together with the
          # release, so a failed build can never publish its prospective tag.
          gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "KDE dev rootfs ${TAG}" \
              --notes-file dist/release-notes.md \
              --latest \
              "dist/${asset}" \
              "dist/${asset}.sha256" \
              dist/package-manifest.txt \
              dist/versions.md \
              dist/package-changes.md

      - name: Update mutable OCI tags
        if: steps.mode.outputs.release == 'true'
        env:
          TAG: ${{ steps.metadata.outputs.tag }}
          OCI_REPO: ${{ steps.metadata.outputs.oci_repo }}
        run: |
          oras tag \
              "${OCI_REPO}:${TAG}" \
              "${SUITE}-latest" \
              latest
